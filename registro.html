<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crear cuenta | NEAR</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f4f7fb;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
color:#172033;
}

.container{
width:100%;
max-width:460px;
background:white;
padding:35px;
border-radius:18px;
box-shadow:0 10px 40px rgba(0,0,0,.08);
}

.logo{
text-align:center;
font-size:32px;
font-weight:800;
color:#1769ff;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:#718096;
margin-bottom:28px;
}

h1{
font-size:25px;
margin-bottom:22px;
text-align:center;
}

.field{
margin-bottom:16px;
}

label{
display:block;
font-size:13px;
font-weight:bold;
margin-bottom:7px;
}

input,select{
width:100%;
padding:13px;
border:1px solid #d9dfe8;
border-radius:9px;
font-size:15px;
outline:none;
}

input:focus,select:focus{
border-color:#1769ff;
}

.options{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:20px;
}

.option{
border:2px solid #e3e8f0;
border-radius:10px;
padding:15px;
cursor:pointer;
text-align:center;
}

.option:hover{
border-color:#1769ff;
}

.option input{
width:auto;
margin-right:6px;
}

button{
width:100%;
border:0;
background:#1769ff;
color:white;
padding:14px;
border-radius:9px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#0f58db;
}

.back{
display:block;
text-align:center;
margin-top:18px;
color:#1769ff;
text-decoration:none;
font-size:14px;
}

.login{
text-align:center;
margin-top:20px;
color:#718096;
font-size:14px;
}

.login a{
color:#1769ff;
text-decoration:none;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">
NEAR.
</div>

<div class="subtitle">
Soluciones y servicios cerca tuyo
</div>

<h1>
Crear una cuenta
</h1>

<form onsubmit="registrar(event)">

<div class="field">

<label>
Nombre y apellido
</label>

<input
type="text"
id="nombre"
placeholder="Ej.: Rocío Martínez"
required
>

</div>

<div class="field">

<label>
Correo electrónico
</label>

<input
type="email"
id="email"
placeholder="tu@email.com"
required
>

</div>

<div class="field">

<label>
Teléfono
</label>

<input
type="tel"
id="telefono"
placeholder="Ej.: 3492 123456"
required
>

</div>

<div class="field">

<label>
Ciudad
</label>

<input
type="text"
id="ciudad"
placeholder="Ej.: Rafaela"
required
>

</div>

<div class="field">

<label>
Quiero usar NEAR para:
</label>

<div class="options">

<label class="option">
<input
type="radio"
name="tipo"
value="cliente"
checked
>
Necesito ayuda
</label>

<label class="option">
<input
type="radio"
name="tipo"
value="prestador"
>
Ofrecer servicios
</label>

</div>

</div>

<div class="field">

<label>
Contraseña
</label>

<input
type="password"
id="password"
placeholder="Crear contraseña"
required
>

</div>

<button type="submit">
Crear mi cuenta
</button>

</form>

<div class="login">
¿Ya tenés una cuenta?
<a href="ingresar.html">
Ingresar
</a>
</div>

<a class="back" href="index.html">
← Volver a NEAR
</a>

</div>

<script>

function registrar(event){

event.preventDefault();

const nombre =
document.getElementById("nombre").value;

const tipo =
document.querySelector(
'input[name="tipo"]:checked'
).value;

if(tipo === "prestador"){

alert(
"¡Bienvenida/o a NEAR! Tu perfil para ofrecer servicios está listo para el próximo paso."
);

}else{

alert(
"¡Cuenta creada! Bienvenida/o a NEAR."
);

}

}

</script>

</body>
</html>
